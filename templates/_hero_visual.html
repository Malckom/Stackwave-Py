{# Original hero artwork: a site being built. Pure inline SVG, no external assets. #}
<svg viewBox="0 0 600 540" role="img" aria-label="Illustration of a website in a browser window next to a snippet of code" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hvGlowBlue"><stop offset="0" stop-color="#2e5bff" stop-opacity=".55"/><stop offset="1" stop-color="#2e5bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="hvGlowMint"><stop offset="0" stop-color="#26fedc" stop-opacity=".35"/><stop offset="1" stop-color="#26fedc" stop-opacity="0"/></radialGradient>
    <linearGradient id="hvAccent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8c3ff"/><stop offset="1" stop-color="#26fedc"/></linearGradient>
    <linearGradient id="hvWindow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#141a24"/></linearGradient>
    <pattern id="hvDots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.5" fill="#b8c3ff" fill-opacity=".14"/></pattern>
    <filter id="hvShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".5"/></filter>
    <clipPath id="hvClip"><rect x="60" y="60" width="440" height="330" rx="18"/></clipPath>
  </defs>

  <!-- ambient glow + dot grid -->
  <rect x="0" y="0" width="600" height="540" fill="url(#hvDots)" opacity=".7"/>
  <circle cx="210" cy="170" r="270" fill="url(#hvGlowBlue)"/>
  <circle cx="450" cy="430" r="230" fill="url(#hvGlowMint)"/>

  <!-- browser window -->
  <g class="hv-float" filter="url(#hvShadow)">
    <rect x="60" y="60" width="440" height="330" rx="18" fill="url(#hvWindow)" stroke="#b8c3ff" stroke-opacity=".22"/>
    <g clip-path="url(#hvClip)">
      <rect x="60" y="60" width="440" height="40" fill="#0f1319"/>
      <circle cx="84" cy="80" r="5" fill="#434656"/><circle cx="102" cy="80" r="5" fill="#434656"/><circle cx="120" cy="80" r="5" fill="#434656"/>
      <rect x="160" y="68" width="250" height="24" rx="12" fill="#1d2022"/>
      <text x="285" y="84" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#8e90a2">yourbrand.co.ke</text>

      <!-- page: nav -->
      <rect x="84" y="120" width="52" height="10" rx="5" fill="url(#hvAccent)"/>
      <rect x="318" y="121" width="30" height="8" rx="4" fill="#434656"/><rect x="358" y="121" width="30" height="8" rx="4" fill="#434656"/>
      <rect x="402" y="116" width="74" height="18" rx="9" fill="#2e5bff"/>

      <!-- page: hero copy -->
      <rect x="84" y="164" width="210" height="16" rx="8" fill="#e0e3e5"/>
      <rect x="84" y="190" width="168" height="16" rx="8" fill="#b8c3ff"/>
      <rect x="84" y="224" width="236" height="7" rx="3.5" fill="#434656"/>
      <rect x="84" y="240" width="200" height="7" rx="3.5" fill="#434656"/>
      <rect x="84" y="268" width="88" height="26" rx="13" fill="#2e5bff"/>
      <rect x="182" y="268" width="88" height="26" rx="13" fill="none" stroke="#26fedc" stroke-opacity=".8"/>

      <!-- page: image block -->
      <rect x="344" y="160" width="132" height="134" rx="14" fill="#101415" stroke="#b8c3ff" stroke-opacity=".18"/>
      <path d="M344 270 L384 232 L416 258 L448 214 L476 244 L476 294 L344 294 Z" fill="#2e5bff" fill-opacity=".45"/>
      <circle cx="378" cy="194" r="12" fill="#26fedc" fill-opacity=".85"/>

      <!-- page: cards -->
      <rect x="84" y="316" width="122" height="58" rx="10" fill="#101415" stroke="#b8c3ff" stroke-opacity=".16"/>
      <rect x="219" y="316" width="122" height="58" rx="10" fill="#101415" stroke="#b8c3ff" stroke-opacity=".16"/>
      <rect x="354" y="316" width="122" height="58" rx="10" fill="#101415" stroke="#b8c3ff" stroke-opacity=".16"/>
      <rect x="96" y="330" width="40" height="7" rx="3.5" fill="#26fedc" fill-opacity=".8"/><rect x="96" y="346" width="82" height="6" rx="3" fill="#434656"/>
      <rect x="231" y="330" width="40" height="7" rx="3.5" fill="#b8c3ff" fill-opacity=".8"/><rect x="231" y="346" width="82" height="6" rx="3" fill="#434656"/>
      <rect x="366" y="330" width="40" height="7" rx="3.5" fill="#26fedc" fill-opacity=".8"/><rect x="366" y="346" width="82" height="6" rx="3" fill="#434656"/>
    </g>
  </g>

  <!-- floating code card -->
  <g class="hv-float-slow">
    <g filter="url(#hvShadow)">
      <rect x="250" y="338" width="312" height="150" rx="16" fill="#0b0f10" stroke="#26fedc" stroke-opacity=".35"/>
    </g>
    <circle cx="274" cy="360" r="4.5" fill="#434656"/><circle cx="290" cy="360" r="4.5" fill="#434656"/><circle cx="306" cy="360" r="4.5" fill="#434656"/>
    <text x="548" y="364" text-anchor="end" font-family="Inter, sans-serif" font-size="10" fill="#8e90a2">app.py</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="274" y="394"><tspan fill="#8e90a2">@app.route(</tspan><tspan fill="#26fedc">"/contact"</tspan><tspan fill="#8e90a2">)</tspan></text>
      <text x="274" y="416"><tspan fill="#b8c3ff">def</tspan><tspan fill="#e0e3e5"> contact():</tspan></text>
      <text x="290" y="438"><tspan fill="#e0e3e5">db.save(inquiry)</tspan></text>
      <text x="290" y="460"><tspan fill="#b8c3ff">return</tspan><tspan fill="#26fedc"> "Message sent"</tspan></text>
    </g>
  </g>
</svg>
